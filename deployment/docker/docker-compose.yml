version: '3.8'

services:
  trading-bot:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: algo-trading-bot
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - ../../.env
    volumes:
      - ../../logs:/app/logs
      - ../../data:/app/data
      - ../../config:/app/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
