version: '3.8'

services:
  trading-bot:
    build: .
    container_name: algorithmic-trading-bot
    restart: unless-stopped
    environment:
      - UPSTOX_API_KEY=${UPSTOX_API_KEY}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI}
      - INITIAL_CAPITAL=${INITIAL_CAPITAL:-100000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/opt/trading-bot/logs
      - ./data:/opt/trading-bot/data
      - ./backtest_results:/opt/trading-bot/backtest_results
      - ./.upstox_token.json:/opt/trading-bot/.upstox_token.json
    networks:
      - trading-network
    # Uncomment to run only during market hours (requires timezone setup)
    # deploy:
    #   restart_policy:
    #     condition: on-failure
    #     delay: 10s

networks:
  trading-network:
    driver: bridge
